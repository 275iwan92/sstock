<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" role="img" aria-labelledby="ug-keluar-otomatis-t ug-keluar-otomatis-d">
<title id="ug-keluar-otomatis-t">Keluar otomatis setelah 30 menit tanpa aktivitas</title>
<desc id="ug-keluar-otomatis-d">Mengetik, menggerakkan mouse, menggulir, dan menyentuh layar dihitung sebagai aktivitas. Bila 28 menit tidak ada aktivitas, peringatan dengan hitung mundur 2 menit muncul di pojok kanan bawah. Tombol Tetap masuk memperpanjang sesi. Bila tidak ditekan, Stoku keluar otomatis ke halaman masuk.</desc>
<defs><marker id="m-ug-keluar-otomatis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-ok"  x="20" y="60" width="190" height="86" rx="9"/>
<text class="t b" x="115" y="86" text-anchor="middle">Anda bekerja</text>
<text class="t s" x="115" y="106" text-anchor="middle">ketik, mouse, gulir,</text>
<text class="t s" x="115" y="122" text-anchor="middle">sentuh = aktivitas</text>
<rect class="n n-gray"  x="250" y="60" width="190" height="86" rx="9"/>
<text class="t b" x="345" y="86" text-anchor="middle">Tidak ada aktivitas</text>
<text class="t s" x="345" y="106" text-anchor="middle">selama 28 menit</text>
<rect class="n n-warn"  x="480" y="60" width="190" height="86" rx="9"/>
<text class="t b" x="575" y="86" text-anchor="middle">Peringatan muncul</text>
<text class="t s" x="575" y="106" text-anchor="middle">Sesi hampir berakhir,</text>
<text class="t s" x="575" y="122" text-anchor="middle">hitung mundur 2 menit</text>
<rect class="n n-ok"  x="720" y="20" width="160" height="70" rx="9"/>
<text class="t b" x="800" y="46" text-anchor="middle">Tetap masuk</text>
<text class="t s" x="800" y="66" text-anchor="middle">sesi diperpanjang</text>
<rect class="n n-bad"  x="720" y="116" width="160" height="70" rx="9"/>
<text class="t b" x="800" y="142" text-anchor="middle">Keluar otomatis</text>
<text class="t s" x="800" y="162" text-anchor="middle">ke halaman masuk</text>
<path class="e" d="M210,103 L250,103" marker-end="url(#m-ug-keluar-otomatis)"/>
<path class="e" d="M440,103 L480,103" marker-end="url(#m-ug-keluar-otomatis)"/>
<path class="e" d="M670,90 L695,90 L695,55 L720,55" marker-end="url(#m-ug-keluar-otomatis)"/>
<path class="e" d="M670,116 L695,116 L695,151 L720,151" marker-end="url(#m-ug-keluar-otomatis)"/>
<text class="t s" x="20" y="204" text-anchor="start">Anda tidak menekan apa pun dalam 2 menit: keluar otomatis. Isian yang belum disimpan tidak tersimpan.</text>
</svg>

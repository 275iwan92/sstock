<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="ug-pembatalan-t ug-pembatalan-d">
<title id="ug-pembatalan-t">Alur membatalkan dokumen yang sudah dikonfirmasi</title>
<desc id="ug-pembatalan-d">Tekan Batalkan dan isi alasan. Bila stok tidak cukup untuk menarik dokumen, pembatalan ditolak dan perlu Penyesuaian Stok. Bila cukup, Supervisor membatalkan langsung; Data Entry mengajukan dan Supervisor menyetujui atau menolak.</desc>
<defs><marker id="m-ug-pembatalan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-in"  x="300" y="15" width="300" height="44" rx="9"/>
<text class="t b" x="450" y="41" text-anchor="middle">Buka dokumen, tekan Batalkan</text>
<rect class="n n-gray"  x="300" y="85" width="300" height="44" rx="9"/>
<text class="t b" x="450" y="111" text-anchor="middle">Isi Alasan (wajib, minimal 3 huruf)</text>
<polygon class="n n-warn" points="450,153 600,195 450,237 300,195"/>
<text class="t b" x="450" y="191" text-anchor="middle">Stok cukup untuk menarik</text>
<text class="t b" x="450" y="206" text-anchor="middle">dokumen ini kembali?</text>
<rect class="n n-bad"  x="690" y="170" width="190" height="54" rx="9"/>
<text class="t b" x="785" y="193" text-anchor="middle">Ditolak otomatis</text>
<text class="t s" x="785" y="209" text-anchor="middle">buat Penyesuaian Stok</text>
<polygon class="n n-warn" points="450,277 575,315 450,353 325,315"/>
<text class="t b" x="450" y="318.5" text-anchor="middle">Siapa yang menekan?</text>
<rect class="n n-bad"  x="60" y="380" width="230" height="64" rx="9"/>
<text class="t b" x="175" y="408" text-anchor="middle">Dibatalkan langsung</text>
<text class="t s" x="175" y="424" text-anchor="middle">stok dikembalikan</text>
<rect class="n n-warn"  x="330" y="380" width="240" height="64" rx="9"/>
<text class="t b" x="450" y="400" text-anchor="middle">Pembatalan Menunggu</text>
<text class="t b" x="450" y="416" text-anchor="middle">Persetujuan</text>
<text class="t s" x="450" y="432" text-anchor="middle">stok belum berubah</text>
<rect class="n n-purple"  x="640" y="380" width="230" height="64" rx="9"/>
<text class="t b" x="755" y="400" text-anchor="middle">Supervisor memutuskan</text>
<text class="t s" x="755" y="416" text-anchor="middle">Setujui: Dibatalkan</text>
<text class="t s" x="755" y="432" text-anchor="middle">Tolak: kembali Terkonfirmasi</text>
<path class="e" d="M450,59 L450,85" marker-end="url(#m-ug-pembatalan)"/>
<path class="e" d="M450,129 L450,153" marker-end="url(#m-ug-pembatalan)"/>
<path class="e" d="M600,195 L690,197" marker-end="url(#m-ug-pembatalan)"/>
<text class="el" x="612" y="188" text-anchor="start">tidak</text>
<path class="e" d="M450,237 L450,277" marker-end="url(#m-ug-pembatalan)"/>
<text class="el" x="458" y="258" text-anchor="start">ya</text>
<path class="e" d="M325,315 L175,315 L175,380" marker-end="url(#m-ug-pembatalan)"/>
<text class="el" x="120" y="296" text-anchor="start">Supervisor /</text>
<text class="el" x="120" y="310" text-anchor="start">Administrator</text>
<path class="e" d="M450,353 L450,380" marker-end="url(#m-ug-pembatalan)"/>
<text class="el" x="458" y="358" text-anchor="start">Data Entry</text>
<path class="e" d="M570,412 L640,412" marker-end="url(#m-ug-pembatalan)"/>
</svg>

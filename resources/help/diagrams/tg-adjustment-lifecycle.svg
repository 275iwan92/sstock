<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="tg-adjustment-lifecycle-t tg-adjustment-lifecycle-d">
<title id="tg-adjustment-lifecycle-t">Adjustment lifecycle</title>
<desc id="tg-adjustment-lifecycle-d">An adjustment is saved as draft; Confirm submits it for approval without touching stock. A Supervisor approves (posted to the ledger) or rejects it. A submitted adjustment can be withdrawn. An approved adjustment is cancelled by a Supervisor with reversal rows.</desc>
<defs><marker id="m-tg-adjustment-lifecycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-gray"  x="20" y="40" width="110" height="54" rx="9"/>
<text class="t b" x="75" y="71" text-anchor="middle">(new)</text>
<rect class="n n-gray"  x="170" y="40" width="120" height="54" rx="9"/>
<text class="t b" x="230" y="63" text-anchor="middle">draft</text>
<text class="t s" x="230" y="79" text-anchor="middle">stock unchanged</text>
<rect class="n n-warn"  x="400" y="40" width="150" height="54" rx="9"/>
<text class="t b" x="475" y="63" text-anchor="middle">approval</text>
<text class="t s" x="475" y="79" text-anchor="middle">submitted, not posted</text>
<rect class="n n-ok"  x="690" y="40" width="160" height="54" rx="9"/>
<text class="t b" x="770" y="63" text-anchor="middle">approved</text>
<text class="t s" x="770" y="79" text-anchor="middle">posted to the ledger</text>
<rect class="n n-bad"  x="420" y="170" width="120" height="54" rx="9"/>
<text class="t b" x="480" y="193" text-anchor="middle">rejected</text>
<text class="t s" x="480" y="209" text-anchor="middle">stock unchanged</text>
<rect class="n n-bad"  x="230" y="170" width="150" height="54" rx="9"/>
<text class="t b" x="305" y="193" text-anchor="middle">cancelled</text>
<text class="t s" x="305" y="209" text-anchor="middle">withdrawn, nothing posted</text>
<rect class="n n-warn"  x="680" y="170" width="180" height="60" rx="9"/>
<text class="t b" x="770" y="196" text-anchor="middle">cancel_pending</text>
<text class="t s" x="770" y="212" text-anchor="middle">stock unchanged yet</text>
<rect class="n n-bad"  x="680" y="320" width="180" height="54" rx="9"/>
<text class="t b" x="770" y="343" text-anchor="middle">cancelled</text>
<text class="t s" x="770" y="359" text-anchor="middle">reversal rows added</text>
<path class="e" d="M130,67 L170,67" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="135" y="58" text-anchor="start">Save</text>
<path class="e" d="M290,67 L400,67" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="296" y="58" text-anchor="start">Confirm (submit)</text>
<path class="e" d="M550,67 L690,67" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="556" y="58" text-anchor="start">Approve (Supervisor)</text>
<path class="e" d="M480,94 L480,170" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="488" y="140" text-anchor="start">Reject (Supervisor)</text>
<path class="e" d="M420,94 L420,130 L305,130 L305,170" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="312" y="122" text-anchor="start">Withdraw (Cancel)</text>
<path class="e" d="M770,94 L770,170" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="778" y="125" text-anchor="start">Cancel by Data</text>
<text class="el" x="778" y="139" text-anchor="start">Entry + reason</text>
<path class="e" d="M770,230 L770,320" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="778" y="280" text-anchor="start">Approve</text>
<path class="e" d="M860,200 L880,200 L880,67 L850,67" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="874" y="150" text-anchor="end">Reject</text>
<path class="e" d="M690,80 L640,80 L640,347 L680,347" marker-end="url(#m-tg-adjustment-lifecycle)"/>
<text class="el" x="634" y="200" text-anchor="end">Cancel by</text>
<text class="el" x="634" y="214" text-anchor="end">Supervisor /</text>
<text class="el" x="634" y="228" text-anchor="end">Administrator</text>
<text class="t s" x="20" y="400" text-anchor="start">Approve is refused when the item stock changed since it was counted (line.system_qty differs): reject it and count again.</text>
<text class="t s" x="20" y="415" text-anchor="start">The cancel_pending branch exists in code but Data Entry cannot reach it: the Adjustment module requires the Supervisor role.</text>
</svg>

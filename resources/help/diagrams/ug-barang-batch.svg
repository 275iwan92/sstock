<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="ug-barang-batch-t ug-barang-batch-d">
<title id="ug-barang-batch-t">Barang, batch kedaluwarsa, dan urutan keluar</title>
<desc id="ug-barang-batch-d">Satu Barang punya kode tetap tanpa tanggal. Saat Penerimaan Barang dikonfirmasi dengan Tanggal Kedaluwarsa, Stoku membuat satu batch per tanggal. Pengeluaran Barang mengambil batch yang kedaluwarsanya paling cepat lebih dulu dan menyambung ke batch berikutnya bila kurang. Titik Pesan Ulang dihitung dari total stok batch yang belum kedaluwarsa.</desc>
<defs><marker id="m-ug-barang-batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-in" x="20" y="30" width="190" height="90" rx="9"/>
<text class="t b" x="115" y="54" text-anchor="middle">Barang</text>
<text class="t m" x="115" y="72" text-anchor="middle">ATK-0008</text>
<text class="t s" x="115" y="90" text-anchor="middle">Lem Kayu Fox 100 ml</text>
<text class="t s" x="115" y="106" text-anchor="middle">kode tetap, tanpa tanggal</text>
<rect class="n n-gray" x="255" y="30" width="190" height="90" rx="9"/>
<text class="t b" x="350" y="58" text-anchor="middle">Penerimaan Barang</text>
<text class="t s" x="350" y="76" text-anchor="middle">pilih barang, isi</text>
<text class="t s" x="350" y="92" text-anchor="middle">Tanggal Kedaluwarsa,</text>
<text class="t s" x="350" y="108" text-anchor="middle">lalu Konfirmasi</text>
<rect class="n n-teal" x="490" y="22" width="190" height="48" rx="9"/>
<text class="t m" x="585" y="42" text-anchor="middle">ATK-0008-261101</text>
<text class="t s" x="585" y="58" text-anchor="middle">kedaluwarsa 01-Nov-2026 · 30 pcs</text>
<rect class="n n-teal" x="490" y="80" width="190" height="48" rx="9"/>
<text class="t m" x="585" y="100" text-anchor="middle">ATK-0008-270508</text>
<text class="t s" x="585" y="116" text-anchor="middle">kedaluwarsa 08-Mei-2027 · 24 pcs</text>
<rect class="n n-ok" x="715" y="30" width="165" height="90" rx="9"/>
<text class="t b" x="797.5" y="54" text-anchor="middle">Pengeluaran Barang</text>
<text class="t s" x="797.5" y="72" text-anchor="middle">batch yang kedaluwarsa</text>
<text class="t s" x="797.5" y="88" text-anchor="middle">paling cepat lebih dulu;</text>
<text class="t s" x="797.5" y="104" text-anchor="middle">kurang: lanjut ke berikutnya</text>
<path class="e" d="M210,75 L255,75" marker-end="url(#m-ug-barang-batch)"/>
<path class="e" d="M445,60 L490,46" marker-end="url(#m-ug-barang-batch)"/>
<path class="e" d="M445,90 L490,104" marker-end="url(#m-ug-barang-batch)"/>
<path class="e" d="M680,46 L715,60" marker-end="url(#m-ug-barang-batch)"/>
<path class="e" d="M680,104 L715,90" marker-end="url(#m-ug-barang-batch)"/>
<rect class="n n-warn" x="20" y="160" width="860" height="64" rx="9"/>
<text class="t b" x="450" y="184" text-anchor="middle">Titik Pesan Ulang dihitung per barang</text>
<text class="t s" x="450" y="202" text-anchor="middle">dari jumlah stok semua batch yang belum kedaluwarsa. Batch yang sudah kedaluwarsa tidak dihitung sebagai stok tersedia.</text>
</svg>

<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="tg-reorder-flow-t tg-reorder-flow-d">
<title id="tg-reorder-flow-t">Re-order flow</title>
<desc id="tg-reorder-flow-d">When the available stock of a product (batches that are not expired) is at or below its Reorder Point, the home screen alerts. Record Order writes an open reorder_orders row. Confirming a Receiving closes the open rows of its products and cancelling that Receiving reopens them.</desc>
<defs><marker id="m-tg-reorder-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-bad"  x="20" y="30" width="200" height="76" rx="9"/>
<text class="t b" x="120" y="56" text-anchor="middle">Product available stock</text>
<text class="t s" x="120" y="72" text-anchor="middle">&lt;= reorder_point</text>
<text class="t s" x="120" y="88" text-anchor="middle">(non-expired batches)</text>
<rect class="n n-warn"  x="260" y="30" width="190" height="76" rx="9"/>
<text class="t b" x="355" y="64" text-anchor="middle">Home alert</text>
<text class="t s" x="355" y="80" text-anchor="middle">Order Status: not ordered</text>
<rect class="n n-in"  x="490" y="30" width="190" height="76" rx="9"/>
<text class="t b" x="585" y="64" text-anchor="middle">Record Order</text>
<text class="t s" x="585" y="80" text-anchor="middle">POST reorder-orders: product, ordered_at, ref_no</text>
<rect class="n n-ok"  x="720" y="30" width="160" height="76" rx="9"/>
<text class="t b" x="800" y="64" text-anchor="middle">Open order</text>
<text class="t s" x="800" y="80" text-anchor="middle">closed_at = NULL</text>
<path class="e" d="M220,68 L260,68" marker-end="url(#m-tg-reorder-flow)"/>
<path class="e" d="M450,68 L490,68" marker-end="url(#m-tg-reorder-flow)"/>
<path class="e" d="M680,68 L720,68" marker-end="url(#m-tg-reorder-flow)"/>
<rect class="n n-teal"  x="490" y="160" width="390" height="62" rx="9"/>
<text class="t b" x="685" y="187" text-anchor="middle">Receiving confirmed</text>
<text class="t s" x="685" y="203" text-anchor="middle">closes open orders of its products: closed_at, receiving_id</text>
<path class="e" d="M800,106 L800,160" marker-end="url(#m-tg-reorder-flow)"/>
<path class="e dash" d="M490,191 L350,191 L350,106" marker-end="url(#m-tg-reorder-flow)"/>
<text class="t el" x="20" y="190" text-anchor="start">Receiving cancelled (finishCancel):</text>
<text class="t el" x="20" y="205" text-anchor="start">reopens orders where receiving_id = document</text>
</svg>

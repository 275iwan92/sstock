<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="tg-system-flow-t tg-system-flow-d">
<title id="tg-system-flow-t">System flow</title>
<desc id="tg-system-flow-d">Login and module access checks lead to the menu. Users enter master data and four document types; a routine Stok Opname ends in one automatic Adjustment. StockDocuments runs the document lifecycle, StockLedger is the only code that changes stock in items and stock_movements, and reports and the home screen read the result.</desc>
<defs><marker id="m-tg-system-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-gray"  x="20" y="20" width="260" height="62" rx="9"/>
<text class="t b" x="150" y="47" text-anchor="middle">Login</text>
<text class="t s" x="150" y="63" text-anchor="middle">AuthController: username or e-mail + password</text>
<rect class="n n-gray"  x="320" y="20" width="260" height="62" rx="9"/>
<text class="t b" x="450" y="47" text-anchor="middle">Access check</text>
<text class="t s" x="450" y="63" text-anchor="middle">auth, EnsureModuleAccess: role + group + RO/RW</text>
<rect class="n n-gray"  x="620" y="20" width="260" height="62" rx="9"/>
<text class="t b" x="750" y="47" text-anchor="middle">Menu</text>
<text class="t s" x="750" y="63" text-anchor="middle">Modules + Menu: only permitted modules</text>
<path class="e" d="M280,51 L320,51" marker-end="url(#m-tg-system-flow)"/>
<path class="e" d="M580,51 L620,51" marker-end="url(#m-tg-system-flow)"/>
<rect class="g" x="20" y="112" width="860" height="130" rx="12"/>
<text class="t s" x="32" y="129">User input: master data and stock documents</text>
<rect class="n n-teal"  x="34" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="98" y="177" text-anchor="middle">Master data</text>
<text class="t s" x="98" y="193" text-anchor="middle">products, units ...</text>
<rect class="n n-teal"  x="174" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="238" y="177" text-anchor="middle">Opening Balance</text>
<text class="t s" x="238" y="193" text-anchor="middle">Supervisor only</text>
<rect class="n n-teal"  x="314" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="378" y="177" text-anchor="middle">Receiving</text>
<text class="t s" x="378" y="193" text-anchor="middle">from a supplier</text>
<rect class="n n-teal"  x="454" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="518" y="177" text-anchor="middle">Issuance</text>
<text class="t s" x="518" y="193" text-anchor="middle">to a recipient</text>
<rect class="n n-teal"  x="594" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="658" y="177" text-anchor="middle">Adjustment</text>
<text class="t s" x="658" y="193" text-anchor="middle">ad hoc; Approve</text>
<rect class="n n-teal"  x="734" y="150" width="128" height="62" rx="9"/>
<text class="t b" x="798" y="177" text-anchor="middle">Stok Opname</text>
<text class="t s" x="798" y="193" text-anchor="middle">routine count; ADJ</text>
<path class="e" d="M750,82 L750,97 L750,112" marker-end="url(#m-tg-system-flow)"/>
<rect class="n n-purple"  x="190" y="276" width="520" height="62" rx="9"/>
<text class="t b" x="450" y="303" text-anchor="middle">StockDocuments: document lifecycle</text>
<text class="t s" x="450" y="319" text-anchor="middle">draft, confirm, approve, cancel. Stock never changes before Confirm.</text>
<path class="e" d="M450,242 L450,276" marker-end="url(#m-tg-system-flow)"/>
<rect class="n n-purple"  x="190" y="372" width="520" height="62" rx="9"/>
<text class="t b" x="450" y="399" text-anchor="middle">StockLedger: the only code that changes stock</text>
<text class="t s" x="450" y="415" text-anchor="middle">post, reverse, assertReversible; moving average cost</text>
<path class="e" d="M450,338 L450,372" marker-end="url(#m-tg-system-flow)"/>
<rect class="n n-purple"  x="190" y="470" width="250" height="62" rx="9"/>
<text class="t b" x="315" y="497" text-anchor="middle">items (batches)</text>
<text class="t s" x="315" y="513" text-anchor="middle">stock_qty and avg_cost: balance cache</text>
<rect class="n n-purple"  x="460" y="470" width="250" height="62" rx="9"/>
<text class="t b" x="585" y="497" text-anchor="middle">stock_movements</text>
<text class="t s" x="585" y="513" text-anchor="middle">ledger rows, never edited</text>
<path class="e" d="M320,434 L320,470" marker-end="url(#m-tg-system-flow)"/>
<path class="e" d="M580,434 L580,470" marker-end="url(#m-tg-system-flow)"/>
<rect class="n n-gray"  x="190" y="570" width="250" height="62" rx="9"/>
<text class="t b" x="315" y="597" text-anchor="middle">Reports</text>
<text class="t s" x="315" y="613" text-anchor="middle">stock card, summary, expiry ...</text>
<rect class="n n-gray"  x="460" y="570" width="250" height="62" rx="9"/>
<text class="t b" x="585" y="597" text-anchor="middle">Home screen</text>
<text class="t s" x="585" y="613" text-anchor="middle">KPIs, reorder alerts, order log</text>
<path class="e" d="M315,532 L315,570" marker-end="url(#m-tg-system-flow)"/>
<path class="e" d="M585,532 L585,570" marker-end="url(#m-tg-system-flow)"/>
</svg>

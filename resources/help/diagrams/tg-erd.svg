<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 940" role="img" aria-labelledby="tg-erd-t tg-erd-d">
<title id="tg-erd-t">Database relations (ERD)</title>
<desc id="tg-erd-d">Master tables (categories, locations, units, suppliers, departments, recipients) feed products. A product has batches in items. stock_documents have stock_document_lines that point at items, and every posting writes stock_movements. reorder_orders belong to a product and are closed by a Receiving. users belong to user_groups, which grant modules in user_group_modules.</desc>
<defs><marker id="m-tg-erd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="n n-gray" x="20" y="20" width="190" height="92" rx="7"/>
<line class="n-rule" x1="20" y1="44" x2="210" y2="44"/>
<text class="t b" x="28" y="36">categories</text>
<text class="t m" x="28" y="58">id PK</text>
<text class="t m" x="28" y="73">code (3 chars, unique)</text>
<text class="t m" x="28" y="88">name</text>
<text class="t m" x="28" y="103">is_active</text>
<rect class="n n-gray" x="20" y="140" width="190" height="92" rx="7"/>
<line class="n-rule" x1="20" y1="164" x2="210" y2="164"/>

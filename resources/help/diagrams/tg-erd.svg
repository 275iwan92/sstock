<text class="t m" x="28" y="178">id PK</text>
<text class="t m" x="28" y="193">code (unique)</text>
<text class="t m" x="28" y="208">name</text>
<text class="t m" x="28" y="223">is_active</text>
<rect class="n n-gray" x="20" y="260" width="190" height="107" rx="7"/>
<line class="n-rule" x1="20" y1="284" x2="210" y2="284"/>
<text class="t b" x="28" y="276">units</text>
<text class="t m" x="28" y="298">id PK</text>
<text class="t m" x="28" y="313">code (unique)</text>
<text class="t m" x="28" y="328">name</text>
<text class="t m" x="28" y="343">kind</text>
<text class="t m" x="28" y="358">is_active</text>
<rect class="n n-gray" x="20" y="390" width="190" height="92" rx="7"/>
<line class="n-rule" x1="20" y1="414" x2="210" y2="414"/>
<text class="t b" x="28" y="406">unit_conversions</text>
<text class="t m" x="28" y="428">id PK</text>
<text class="t m" x="28" y="443">from_unit</text>
<text class="t m" x="28" y="458">to_unit</text>
<text class="t m" x="28" y="473">factor</text>
<path class="e noarrow dash" d="M115,367 L115,390"/>
<text class="t s" x="20" y="500" text-anchor="start">units and locations are referenced by CODE</text>
<text class="t s" x="20" y="515" text-anchor="start">(products.unit, products.location,</text>
<text class="t s" x="20" y="530" text-anchor="start">unit_conversions.*_unit): soft links, no FK.</text>
<rect class="n n-in" x="270" y="20" width="250" height="197" rx="7"/>
<line class="n-rule" x1="270" y1="44" x2="520" y2="44"/>
<text class="t b" x="278" y="36">products</text>
<text class="t m" x="278" y="58">id PK</text>
<text class="t m" x="278" y="73">code (unique)</text>
<text class="t m" x="278" y="88">name</text>
<text class="t m" x="278" y="103">category_id FK</text>
<text class="t m" x="278" y="118">unit (units.code)</text>
<text class="t m" x="278" y="133">location (locations.code)</text>
<text class="t m" x="278" y="148">unit_price</text>
<text class="t m" x="278" y="163">reorder_point, reorder_qty</text>
<text class="t m" x="278" y="178">lead_time_days</text>
<text class="t m" x="278" y="193">tracks_expiry</text>
<text class="t m" x="278" y="208">is_active</text>

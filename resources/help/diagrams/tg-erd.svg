<text class="t m" x="278" y="343">created_by FK</text>
<text class="t m" x="278" y="358">closed_at</text>
<text class="t m" x="278" y="373">receiving_id FK</text>
<rect class="n n-in" x="270" y="430" width="250" height="167" rx="7"/>

<text class="t m" x="278" y="483">product_id FK</text>
<text class="t m" x="278" y="498">code (unique)</text>
<text class="t m" x="278" y="513">expiry_date (null = none)</text>
<text class="t m" x="278" y="528">stock_qty</text>
<text class="t m" x="278" y="543">avg_cost</text>
<text class="t m" x="278" y="558">name, category_id, unit,</text>
<text class="t m" x="278" y="573">location, unit_price ... (copy)</text>
<text class="t m" x="278" y="588">is_active</text>
<rect class="n n-purple" x="590" y="20" width="250" height="212" rx="7"/>
<line class="n-rule" x1="590" y1="44" x2="840" y2="44"/>
<text class="t b" x="598" y="36">stock_documents</text>
<text class="t m" x="598" y="58">id PK</text>
<text class="t m" x="598" y="73">doc_no (unique)</text>
<text class="t m" x="598" y="88">type OPENING|IN|OUT|ADJ</text>
<text class="t m" x="598" y="103">doc_at, status</text>
<text class="t m" x="598" y="118">supplier_id FK</text>
<text class="t m" x="598" y="133">recipient_id, department_id FK</text>
<text class="t m" x="598" y="148">recipient, department (names)</text>
<text class="t m" x="598" y="163">ref_no, reason, note</text>
<text class="t m" x="598" y="178">created_by FK</text>
<text class="t m" x="598" y="193">confirmed_by/at, approved_by/at</text>
<text class="t m" x="598" y="208">cancel_requested_by/at</text>
<text class="t m" x="598" y="223">cancelled_by/at, cancel_reason</text>
<rect class="n n-gray" x="590" y="300" width="250" height="137" rx="7"/>
<line class="n-rule" x1="590" y1="324" x2="840" y2="324"/>
<text class="t b" x="598" y="316">stock_document_lines</text>
<text class="t m" x="598" y="338">id PK</text>
<text class="t m" x="598" y="353">stock_document_id FK</text>
<text class="t m" x="598" y="368">item_id FK</text>
<text class="t m" x="598" y="383">qty, unit_cost</text>
<text class="t m" x="598" y="398">system_qty, counted_qty</text>
<text class="t m" x="598" y="413">entered_qty/unit/unit_cost</text>
<text class="t m" x="598" y="428">note</text>
<rect class="n n-purple" x="590" y="490" width="250" height="167" rx="7"/>
<line class="n-rule" x1="590" y1="514" x2="840" y2="514"/>
<text class="t b" x="598" y="506">stock_movements</text>
<text class="t m" x="598" y="528">id PK</text>
<text class="t m" x="598" y="543">item_id FK</text>
<text class="t m" x="598" y="558">stock_document_id FK</text>
<text class="t m" x="598" y="573">type, moved_at</text>
<text class="t m" x="598" y="588">qty, unit_cost</text>
<text class="t m" x="598" y="603">balance_qty</text>
<text class="t m" x="598" y="618">balance_avg_cost</text>
<text class="t m" x="598" y="633">user_id FK</text>
<text class="t m" x="598" y="648">reversal_of FK (self)</text>
<rect class="g" x="900" y="10" width="190" height="410" rx="12"/>
<text class="t s" x="912" y="27">Parties (ids + copied names)</text>
<rect class="n n-gray" x="910" y="40" width="170" height="122" rx="7"/>
<line class="n-rule" x1="910" y1="64" x2="1080" y2="64"/>
<text class="t b" x="918" y="56">suppliers</text>
<text class="t m" x="918" y="78">id PK</text>
<text class="t m" x="918" y="93">code (unique)</text>
<text class="t m" x="918" y="108">name</text>
<text class="t m" x="918" y="123">phone, contact_*</text>
<text class="t m" x="918" y="138">address, postal_code</text>
<text class="t m" x="918" y="153">area_level, area_id</text>
<rect class="n n-gray" x="910" y="190" width="170" height="92" rx="7"/>

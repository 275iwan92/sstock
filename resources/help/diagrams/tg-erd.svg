<text class="t m" x="688" y="788">module (Modules code)</text>
<text class="t m" x="688" y="803">access  RO | RW</text>
<path class="e noarrow" d="M290,781 L380,773.5"/>
<path class="e noarrow" d="M590,773.5 L680,773.5"/>
<text class="t m" x="300" y="765" text-anchor="start">1  N</text>
<text class="t m" x="600" y="765" text-anchor="start">1  N</text>
<text class="t s" x="20" y="880" text-anchor="start">FK = foreign key. Solid lines are 1:N relations; dashed lines are soft links (receiving_id on reorder_orders, codes of units/locations).</text>
<text class="t s" x="20" y="895" text-anchor="start">users.id is also referenced by created_by, confirmed_by, approved_by, cancelled_by (stock_documents), user_id (stock_movements) and created_by (reorder_orders); those lines are not drawn.</text>
<text class="t s" x="20" y="910" text-anchor="start">Region tables geo_country, geo_region, geo_city, geo_district, geo_village are copied from tmerp and referenced by suppliers.area_id.</text>

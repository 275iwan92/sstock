<text class="t m" x="628" y="133">recipient_id, department_id FK</text>
<text class="t m" x="628" y="148">recipient, department (names)</text>
<text class="t m" x="628" y="163">ref_no, reason, note</text>
<text class="t m" x="628" y="178">created_by FK</text>
<text class="t m" x="628" y="193">confirmed_by/at, approved_by/at</text>
<text class="t m" x="628" y="208">cancel_requested_by/at</text>

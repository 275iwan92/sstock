<line class="n-rule" x1="40" y1="759" x2="290" y2="759"/>
<text class="t b" x="48" y="751">users</text>
<text class="t m" x="48" y="773">id PK</text>
<text class="t m" x="48" y="788">name, username, email</text>
<text class="t m" x="48" y="803">role, group_id FK</text>
<text class="t m" x="48" y="818">password, is_active</text>
<rect class="n n-gray" x="380" y="735" width="210" height="77" rx="7"/>

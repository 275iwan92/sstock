<text class="t m" x="28" y="308">name</text>
<text class="t m" x="28" y="323">kind</text>
<text class="t m" x="28" y="338">is_active</text>
<rect class="n n-gray" x="20" y="365" width="190" height="92" rx="7"/>
<line class="n-rule" x1="20" y1="389" x2="210" y2="389"/>
